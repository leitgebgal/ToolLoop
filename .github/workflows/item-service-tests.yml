name: Item Service - Unit Tests

on:
  push:
    paths:
      - 'services/item-service/**'
      - '.github/workflows/item-service-tests.yml'
  pull_request:
    paths:
      - 'services/item-service/**'
      - '.github/workflows/item-service-tests.yml'

jobs:
  test:
    name: Run Unit Tests (Kotlin / JUnit 5)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/item-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Gradle wrapper permissions
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: item-service-test-report
          path: services/item-service/build/reports/tests/test/