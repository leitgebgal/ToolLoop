name: User Service - Unit Tests

on:
  push:
    paths:
      - 'services/user-service/**'
      - '.github/workflows/user-service-tests.yml'
  pull_request:
    paths:
      - 'services/user-service/**'
      - '.github/workflows/user-service-tests.yml'

jobs:
  test:
    name: Run Unit Tests (Node / Jest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/user-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: services/user-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: user-service-coverage-report
          path: services/user-service/coverage/